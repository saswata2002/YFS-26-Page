<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Full Flow Spec</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
<style>
/* Animation spec sheet for a prototype's whole interaction flow (scenes come from window.SPEC).
   Same layout as a ProtoPie recording view: canvas (flow → layers tree · live preview · inspector · playback)
   over a timeline of property tracks — light bar = delay, dark bar = duration.
   The preview is the real prototype in an iframe; this page only drives it (it never edits it).

   Styled with Lightweight UI v0.2.0 (lightweight-ui-kit.vercel.app), the internal-tools kit:
   Geist / Geist Mono, ink on paper with ink washes for every hover and fill, colour only for
   meaning, corners that grow with the object (smoothed with corner-shape), soft shadows only on
   things that float, one ease-out curve. Light theme only. */
:root {
  /* ── kit colour ── */
  --bg: #ffffff;
  --card: #ffffff;
  --ink: #18191d;
  --on-ink: #ffffff;
  --muted: #666879;
  --line: #ededec;
  --line-strong: #e3e3e0;
  --line-control: #949494;
  --wash-1: color-mix(in oklab, var(--ink) 1.5%, transparent);
  --wash-2: color-mix(in oklab, var(--ink) 3%, transparent);
  --wash-3: color-mix(in oklab, var(--ink) 4%, transparent);
  --wash-4: color-mix(in oklab, var(--ink) 6%, transparent);
  --wash-5: color-mix(in oklab, var(--ink) 8%, transparent);
  --wash-6: color-mix(in oklab, var(--ink) 12%, transparent);
  --ink-hover: color-mix(in oklab, var(--ink) 88%, var(--bg));
  --draft: #96660b; --draft-bg: #fbf3e3;
  --accent: #ec642b;   /* the internal-tools orange — playhead, its trail, the record dot */
  --chart-1: #277fff;
  --fn: #7c5cff;     /* easing function names, as ProtoPie colours them */
  --live: #e5484d;   /* the value at the playhead */

  /* ── spec-sheet roles, mapped onto the kit ── */
  --canvas: color-mix(in oklab, #18191d 3%, #ffffff);
  --dot: color-mix(in oklab, var(--ink) 9%, transparent);
  --ink-2: var(--muted); --ink-3: var(--muted);          /* the kit has one secondary text colour */
  --row: var(--wash-2); --row-hover: var(--wash-4);
  --delay: var(--wash-6); --dur: var(--ink); --dur-ink: var(--on-ink);
  --head: var(--accent);

  /* ── kit radius (named by object) ── */
  --r-xs: 6px; --r-lg: 8px; --r-chip: 10px; --r-xl: 12px; --r-control: 14px; --r-2xl: 16px; --r-tile: 20px; --r-panel: 22px;
  --r-full: 999px;

  /* ── kit shadow ── */
  --sh-card: 0 1px 2px rgb(0 0 0 / .04);   /* floating cards: the hairline does the edge, the shadow only a whisper of lift */
  --sh-toast: 0 12px 32px -12px rgb(0 0 0 / .32);
  --sh-pill: 0 1px 2px rgb(0 0 0 / .06), 0 1px 1px rgb(0 0 0 / .04);
  --sh-device: 0 0 0 1px rgb(0 0 0 / .06), 0 1px 2px rgb(0 0 0 / .03), 0 24px 60px -24px rgb(0 0 0 / .35);

  /* ── kit motion ── */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --d-press: 160ms; --d-swap: 180ms; --d-popover: 150ms;

  /* ── kit type (named by job) ── */
  --sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --t-micro: 11px; --t-caption: 12px; --t-label: 13px; --t-ui: 14px; --t-body: 15px; --t-title: 17px;

  /* ── layout ── */
  --gut: 28px; --card-w: 360px;
  --stage-pad: 52px;   /* extra room above and below the phone, so it sits smaller and calmer on the stage */
  --lab: 320px; --rowh: 24px; --rowgap: 14px;
  --tl-pt: 20px; --tl-pr: 32px; --tl-pb: 28px;

  color-scheme: light;
}

/* The kit's corners are drawn with superellipse(4). Safari and Firefox can't, and would draw the
   full radius as a circle, so there they shrink to the plain-rounding equivalent (×0.15). */
* { box-sizing: border-box; corner-shape: superellipse(4); }
@supports not (corner-shape: round) {
  :root { --r-xs: .9px; --r-lg: 1.2px; --r-chip: 1.5px; --r-xl: 1.8px; --r-control: 2.1px; --r-2xl: 2.4px; --r-tile: 3px; --r-panel: 3.3px; --r-full: 2.4px; }
}
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: var(--t-label); line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
svg { flex: none; }
.num, .len, .tick, .bar, .ctrl__state, .insp dd { font-variant-numeric: tabular-nums; }

/* Press feedback, as the kit's u-press: pressables shrink to 97% while held. */
.top__back, .copy, .iters button, .ctrl button, .insp__go, .flow li button, .anims button {
  transition: transform var(--d-press) var(--ease-out), background-color var(--d-press) var(--ease-out), color var(--d-press) var(--ease-out), box-shadow var(--d-press) var(--ease-out);
}
.top__back:active, .copy:active, .iters button:active, .ctrl button:active, .insp__go:active { transform: scale(.97); }
/* wide rows dim instead: 3% of a full-width row moves its edges too far */
.flow li button:active, .anims button:active { opacity: .7; }

/* ── section head: 11px semibold caps, the kit's sidebar label ── */
.eyebrow, .grp b, .insp__eyebrow { margin: 0; font-size: var(--t-micro); font-weight: 600; letter-spacing: .08em; line-height: 1.5; text-transform: uppercase; color: var(--muted); }
/* a count chip clubbed to its section head (as in the A/B library's "Customer 16"): a wash, muted semibold figures */
.count { display: inline-grid; place-items: center; min-width: 20px; height: 18px; padding: 0 6px; border-radius: var(--r-xs); background: var(--wash-4); font-family: var(--sans); font-size: var(--t-micro); font-weight: 600; line-height: 1; color: var(--muted); letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }

/* ── top bar ── */
.top { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 var(--gut) 0 18px; border-bottom: 1px solid var(--line); background: var(--bg); }
.top__back { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r-chip); text-decoration: none; flex: none; color: var(--ink); }
.top__back svg { width: 18px; height: 18px; }
.top__title { font-size: var(--t-body); font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top__sp { flex: 1; }

/* Primary button, md: ink fill, 14px medium, 14px corner. The one primary action on the page. */
.copy, .insp__go { height: 36px; padding: 0 14px; border-radius: var(--r-control); background: var(--ink); color: var(--on-ink); font-size: var(--t-ui); font-weight: 500; flex: none; display: inline-flex; align-items: center; gap: 6px; }
.copy { min-width: 88px; padding: 0 10px; justify-content: center; }   /* snug: 10px sides, wide enough for "✓ Copied" (68px) so the swap never resizes it */
.copy svg { width: 15px; height: 15px; }
/* Iteration picker — the kit's segmented control, beside Copy link: a wash track, the chosen iteration a white
   pill with the kit's pill shadow, Geist Mono figures. Built from SPEC.paths; hidden when there is only one.
   Picking one re-records the open scene for that iteration in place (no reload) and updates ?v= — the
   prototype's own switcher still decides where a visit starts. Each figure's tooltip is SPEC.iterations[n]. */
.iters[hidden] { display: none; }
.iters { height: 36px; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: var(--r-control); background: var(--wash-3); flex: none; }
.iters__lab { padding: 0 8px 0 9px; font-size: var(--t-caption); font-weight: 500; color: var(--muted); white-space: nowrap; }
.iters button { min-width: 34px; height: 30px; padding: 0 8px; border-radius: var(--r-xl); font-family: var(--mono); font-size: var(--t-caption); font-weight: 500; font-variant-numeric: tabular-nums; color: var(--muted); background: transparent; }
.iters button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--sh-pill); }

/* ── canvas: the kit playground's dotted stage ── */
.canvas { position: relative; height: clamp(600px, 66vh, 760px); overflow: hidden;
  background-color: var(--canvas); background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 16px 16px; background-position: 8px 8px; }
/* Cards float over the stage: card surface, hairline edge, the kit's soft card shadow. */
.card { position: absolute; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-tile); box-shadow: var(--sh-card); }

/* left column: Layers and Flow are one accordion — opening one collapses the other to its header */
.side { position: absolute; left: var(--gut); top: var(--gut); bottom: calc(var(--gut) + 46px + 16px); width: var(--card-w); z-index: 4; display: flex; flex-direction: column; gap: 16px; }
.side > .card { position: relative; }
.flow { flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }   /* hugs its scenes; shrinks and scrolls when they don't fit */
.card__head { flex: none; height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 22px; border-bottom: 1px solid var(--line); background: var(--card); }
.card__title { margin: 0; min-width: 0; font-size: var(--t-body); font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card__title small { margin-left: 6px; font-size: inherit; font-weight: 400; color: var(--muted); }
.card__title small::before { content: '· '; }
.card__head .tag { margin: 0; flex: none; }
.flow ol { list-style: none; margin: 0; padding: 10px; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
/* still scrolls (wheel, trackpad, touch, keyboard), just without a visible bar */
.flow ol { scrollbar-width: none; }
.flow ol::-webkit-scrollbar { display: none; }
/* parent: a scene */
.flow ol > li > button { width: 100%; text-align: left; display: grid; grid-template-columns: 24px 1fr auto; gap: 2px 12px; align-items: center; padding: 10px 12px; border-radius: var(--r-chip); }
.flow ol > li > button[aria-pressed="true"] { background: var(--wash-4); }
/* scene number: the kit's count pill — micro mono on a wash; ink for the open scene */
.flow .n { align-self: center; width: 24px; height: 20px; display: grid; place-items: center; border-radius: var(--r-xs); background: var(--wash-4); font-family: var(--mono); font-size: var(--t-micro); font-weight: 500; color: var(--muted); }
.flow button[aria-current="true"] .n { background: var(--ink); color: var(--on-ink); }
.flow .nm { font-size: var(--t-ui); font-weight: 500; color: var(--ink); }
.flow .len { font-family: var(--mono); font-size: var(--t-micro); color: var(--muted); }
/* children: the layers that scene animates, on a guide line from the scene number */
.tree { position: relative; list-style: none; margin: 4px 0 8px; padding: 0 0 0 24px; display: flex; flex-direction: column; gap: 2px; }
.tree.is-new { animation: panelIn var(--d-swap) var(--ease-out); }
.tree::before { content: ''; position: absolute; left: 23.5px; top: 0; bottom: 16px; width: 1px; background: var(--line-strong); }
.tree button { position: relative; width: 100%; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 14px; border-radius: var(--r-chip); text-align: left; font-size: var(--t-label); color: var(--muted); }
.tree button::before { content: ''; position: absolute; left: -0.5px; top: 50%; width: 8px; height: 1px; background: var(--line-strong); }
.tree button[aria-pressed="true"] { background: var(--wash-4); color: var(--ink); font-weight: 500; }
.tree button[data-cur] { color: var(--ink); font-weight: 500; }
.tree button[data-cur] .tree__ico { color: var(--accent); }
.tree__ico { width: 14px; height: 14px; flex: none; }
.tree__nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree__n { font-family: var(--mono); font-size: var(--t-micro); font-weight: 400; color: var(--muted); }
@keyframes panelIn { from { opacity: 0; transform: translateY(4px); } }
/* badge: neutral by default; amber (the kit's draft tone) when the timing varies */
.tag { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: var(--r-full); background: var(--wash-4); color: var(--muted); font-family: var(--sans); font-size: var(--t-micro); font-weight: 500; line-height: 1; vertical-align: 1px; margin-left: 6px; letter-spacing: 0; text-transform: none; }
.tag--warm { background: var(--draft-bg); color: var(--draft); }


/* ── inspector: the kit playground's Props panel ── */
.insp { right: var(--gut); top: var(--gut); width: var(--card-w); max-height: calc(100% - var(--gut) * 2); padding: 0 22px 20px; overflow: auto; scrollbar-width: none; }   /* hugs its content, capped at the canvas */
/* the header stays put while the panel scrolls */
.insp > .card__head { position: sticky; top: 0; z-index: 1; margin: 0 -22px; }
.insp::-webkit-scrollbar { display: none; }
/* sections: Values · Timing · Easing, each under a caps head and a hairline */
.isec { margin: 20px -22px 0; padding: 20px 22px 0; border-top: 1px solid var(--line); }   /* hairline edge to edge, like the Flow head's */
.card__head + .isec { margin-top: 0; border-top: 0; }   /* the header's own hairline is the first divider */
.isec__h { margin: 0 0 14px; display: flex; align-items: center; gap: 8px; font-size: var(--t-micro); font-weight: 600; letter-spacing: .08em; line-height: 1.5; text-transform: uppercase; color: var(--muted); }
.isec__name { margin: 0 0 12px; display: flex; align-items: center; gap: 8px; font-size: var(--t-label); font-weight: 500; color: var(--ink); }
.isec__name .tag { margin: 0; }
/* label · value pairs, as in ProtoPie: the label muted, the value beside it in the accent */
.insp .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin: 0; }
.insp .kv > div { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.insp .kv > .wide { grid-column: 1 / -1; }
.insp .kv dt { flex: none; font-size: var(--t-label); color: var(--muted); }
.insp .kv dd { margin: 0; min-width: 0; font-family: var(--mono); font-size: var(--t-label); font-weight: 500; color: var(--accent); word-break: break-word; font-variant-numeric: tabular-nums; }
.insp__plot { display: block; width: 100%; height: 104px; margin: 0 0 16px; padding: 6px 4px; border: 1px solid var(--line); border-radius: var(--r-xl); background: var(--wash-1); color: var(--accent); }   /* the curve in the accent */
.isec .insp__plot { margin: 0 0 14px; }
/* code block: the kit's — Geist Mono 12.5 on the faintest wash, hairline, 14×16 padding */
.insp__code { display: block; margin-top: 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-xl); background: var(--wash-2); font-family: var(--mono); font-size: 12.5px; line-height: 1.625; color: color-mix(in oklab, var(--ink) 90%, transparent); word-break: break-all; }
.insp__go { margin-top: 20px; }
/* easing expression, as ProtoPie writes it: FUNCTION(Arg value) */
.x { font-family: var(--mono); font-size: var(--t-label); font-weight: 500; color: var(--fn); }
.x .x-n { color: var(--accent); }
.isec__h .tag { margin: 0; text-transform: none; letter-spacing: 0; }
/* "Current" follows the playhead — in red, as ProtoPie marks it */
.insp .kv dd .live { color: var(--live); }
/* the layer's "at 0.8s on the playhead" caption */
.insp__cap { margin: 12px 0 0; font-size: var(--t-caption); color: var(--muted); }
.anims { list-style: none; margin: -4px 0 -10px;   /* the rows' own 10px padding stands in for the panel's bottom space */ padding: 0; display: flex; flex-direction: column; gap: 2px; }
.anims button { width: calc(100% + 24px); margin: 0 -12px; display: grid; grid-template-columns: 16px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: var(--r-chip); text-align: left; }
.anims svg { width: 15px; height: 15px; }
.anims .tree__ico { width: 14px; height: 14px; color: var(--muted); }
.anims .n { width: 24px; height: 20px; display: grid; place-items: center; border-radius: var(--r-xs); background: var(--wash-4); font-family: var(--mono); font-size: var(--t-micro); font-weight: 500; color: var(--muted); }
.anims button:has(.n) { grid-template-columns: 24px 1fr auto; }
.anims__main { display: flex; flex-direction: column; min-width: 0; }
.anims__main b { font-size: var(--t-label); font-weight: 500; }
.anims__main span { font-family: var(--mono); font-size: var(--t-micro); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.anims__t { font-family: var(--mono); font-size: var(--t-micro); line-height: 1.5; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* the phone's frame top-aligns with the floating cards (the frame is drawn ~4px outside the screen);
   the room it gives up at the top goes to the bottom, so the phone keeps its size */
.stage { position: absolute; left: 50%; top: calc(var(--gut) + 4px); bottom: calc(var(--stage-pad) * 2 - var(--gut) - 4px); transform: translateX(-50%); display: grid; place-items: start center; }
/* the device is rendered content, not chrome: it keeps its own square edge and white screen */
/* The device frame, as in the A/B library: a solid ink outline, its thickness a fraction of the
   screen's height (÷152, ≈5.3pt on 812) so it stays in proportion when the phone is scaled to fit. */
.phone { position: relative; width: var(--pw, 375px); height: var(--ph, 812px); transform-origin: 0 0; background: #fff; overflow: hidden;
  outline: calc(var(--ph, 812px) / 152) solid var(--ink); box-shadow: var(--sh-device); }
.phone iframe { position: absolute; left: 0; top: 0; width: var(--pw, 375px); height: var(--ph, 812px); border: 0; opacity: 0; pointer-events: none; }
.phone iframe.is-front { opacity: 1; pointer-events: auto; }
.phone__veil { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in oklab, var(--bg) 92%, transparent); font-size: var(--t-ui); font-weight: 500; color: var(--muted); text-align: center; padding: 40px; transition: opacity 200ms var(--ease-out) 150ms; }
.phone__veil[hidden] { display: grid; opacity: 0; pointer-events: none; transition-delay: 0ms; }

/* playback: a floating toolbar, control-radius, ghost buttons with one ink play button */
.ctrl { position: absolute; left: var(--gut); bottom: var(--gut); height: 46px; display: flex; align-items: center; gap: 4px; padding: 6px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-2xl); box-shadow: var(--sh-card); z-index: 3; }
.ctrl button { height: 32px; min-width: 32px; padding: 0 10px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: var(--r-chip); color: var(--ink); }
.ctrl #play { width: 32px; padding: 0; background: var(--ink); color: var(--on-ink); }
.ctrl #play svg { width: 12px; height: 13px; margin-left: 1px; }
.ctrl #speed svg { width: 17px; height: 14px; }
.ctrl i { width: 1px; height: 16px; margin: 0 2px; background: var(--line-strong); }
.ctrl__speed { font-family: var(--mono); font-size: var(--t-caption); font-weight: 500; }
.ctrl__state { padding: 0 10px 0 4px; font-family: var(--mono); font-size: var(--t-caption); color: var(--muted); white-space: nowrap; }
.ctrl__cur { display: inline-block; text-align: right; color: var(--ink); }

/* ── timeline ── */
.tlwrap { overflow-x: auto; border-top: 1px solid var(--line); background: var(--bg); }
.tl { position: relative; min-width: 940px; padding: 0 var(--tl-pr) var(--tl-pb) 0; }
.tl__ruler { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: var(--lab) 1fr; align-items: center; height: calc(40px + var(--tl-pt)); padding-top: var(--tl-pt); background: var(--bg); }   /* pinned while the rows scroll; carries the top padding so it keeps its air when pinned */   /* pinned while the rows scroll */
.tl__start { height: 32px; margin-left: 20px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 10px; background: var(--wash-3); border-radius: var(--r-chip); font-size: var(--t-label); font-weight: 600; white-space: nowrap; overflow: hidden; min-width: 0; }
.tl__start svg { width: 13px; height: 12px; }
.tl__start small { font-size: var(--t-label); color: var(--ink); font-weight: 400; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tl__scale { position: relative; height: 40px; margin-left: 10px; cursor: ew-resize; touch-action: none; }
.tl__scale::after { content: ''; position: absolute; left: 0; right: 0; top: 26px; height: 1px; background: var(--line-strong); }
.tick { position: absolute; top: 5px; font-family: var(--mono); font-size: var(--t-micro); color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
.tick::after { content: ''; position: absolute; left: 50%; top: 18.5px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; corner-shape: round; background: var(--ink); }
.tick--minor { color: transparent; }
.tick--minor::after { width: 1px; height: 4px; margin-left: 0; border-radius: 0; background: var(--line-control); top: 19.5px; }
.tick--zero { transform: none; }
.tick--zero::after { left: 0; margin-left: 0; }
.tl__rows { position: relative; }
.grp { display: grid; grid-template-columns: var(--lab) 1fr; height: 34px; align-items: end; padding-bottom: 4px; }
.grp b { padding-left: 30px; }
.grp span { position: relative; margin-left: 10px; padding-bottom: 1px; font-family: var(--mono); font-size: var(--t-micro); color: var(--muted); display: flex; align-items: center; gap: 8px; }
.grp span::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.row { display: grid; grid-template-columns: var(--lab) 1fr; height: calc(var(--rowh) + var(--rowgap)); align-items: center; cursor: pointer; }

<script>
/* ═══ SpecKit — generic helpers shared by every spec sheet (do not edit per project) ═══
   Row helpers: S(spring key, {x0, v0}) · C(curve key) · H(haptic kind, layer, selector, ms | [ms…], note)
   Maths: springFn(ω, ζ, x0, v0) → { d(t), v(t) } (t in s) · firstT(f, test) → first ms where test(d, v)
   Layout: rowEnd(row) / sceneEnd(rows) in ms.                                                     */
window.SpecKit = (() => {
  const springFn = (w, z, x0, v0 = 0) => { const wd = w * Math.sqrt(1 - z * z), a = z * w;
    return { d: (t) => Math.exp(-a * t) * (x0 * Math.cos(wd * t) + ((v0 + a * x0) / wd) * Math.sin(wd * t)),
             v: (t) => Math.exp(-a * t) * (v0 * Math.cos(wd * t) - ((a * v0 + w * w * x0) / wd) * Math.sin(wd * t)) }; };
  const firstT = (f, test, max = 4) => { for (let t = 0; t < max; t += 0.001) if (test(f.d(t), f.v(t))) return t * 1000; return max * 1000; };
  const S = (k, extra = {}) => ({ kind: 'spring', k, ...extra });
  const C = (k) => ({ kind: 'curve', k });
  // haptics (the prototype's Haptics helper): iOS generator + style, Android vibrate, iOS-Safari fallback
  const HAP = {
    tap:     { name: 'tap',     gen: 'UIImpactFeedbackGenerator', style: 'light', vibe: '8ms', call: 'Haptics.tap()' },
    tick:    { name: 'tick',    gen: 'UISelectionFeedbackGenerator', style: 'selection', vibe: '4ms', call: 'Haptics.tick()' },
    snap:    { name: 'snap',    gen: 'UIImpactFeedbackGenerator', style: 'medium', intensity: 0.8, vibe: '12ms', call: 'Haptics.snap()' },
    edge:    { name: 'edge',    gen: 'UIImpactFeedbackGenerator', style: 'rigid', intensity: 0.6, vibe: '10ms', call: 'Haptics.edge()' },
    success: { name: 'success', gen: 'UINotificationFeedbackGenerator', style: 'success', vibe: '[10, 40, 16]', call: 'Haptics.success()' },
    error:   { name: 'error',   gen: 'UINotificationFeedbackGenerator', style: 'error', vibe: '[45, 40, 45, 40, 45]', call: 'Haptics.error()' },
  };
  const H = (k, layer, sel, at, note, extra = {}) => ({ icon: 'haptic', prop: 'Haptic', layer, sel, delay: Array.isArray(at) ? (at[0] || 0) : at, dur: 10, from: '—', to: '—',
    ease: { kind: 'haptic', ...HAP[k] }, marks: Array.isArray(at) ? at : [at], note, ...extra });
  const rowEnd = (r) => r.delay + (r.stagger ? (r.stagger.n - 1) * r.stagger.step : 0) + (r.marks ? Math.max(...r.marks) - r.delay : 0) + r.dur;
  const sceneEnd = (rows) => Math.max(...rows.filter((r) => !r.grp && !r.repeat).map(rowEnd));
  // a PP-style sampled spring's length for a travel of |d| (settles to 0.02 of a unit)
  const sampleLen = (spr, d) => 1000 * Math.max(0.2, Math.log(Math.max(Math.abs(d), 0.02) / 0.02) / (spr.z * spr.w) + 0.05);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));   // real time (for history / tasks to land)
  return { springFn, firstT, S, C, H, HAP, rowEnd, sceneEnd, sampleLen, wait };
})();
</script>

<script id="spec-config">
/* ═══ PROJECT CONFIG — everything specific to this prototype lives here ═══════════
   The engine below never changes between projects: it reads window.SPEC only.
   Full schema: references/config-reference.md · worked example: references/example-noon-config.js
   noon Home → tap the 3D bot → its "Deals we think you'll love" page (orbi/main.js + yf-page.js per iteration).
   Every widget is played twice (forward + back, on + off) and its edge case gets its own scene. */
window.SPEC = (() => {
  const { springFn, firstT, S, C, H, HAP, rowEnd, sceneEnd, wait: realWait } = SpecKit;

  /* this project's haptics (haptics.js): two kinds beyond the template's, and its own Android pulse lengths */
  Object.assign(HAP.tick, { vibe: '8ms' }); Object.assign(HAP.tap, { vibe: '12ms' }); Object.assign(HAP.snap, { vibe: '18ms' }); Object.assign(HAP.success, { vibe: '[14, 60, 24]' });
  HAP.pop = { name: 'pop', gen: 'UIImpactFeedbackGenerator', style: 'medium', intensity: 0.7, vibe: '18ms', call: 'Haptics.pop()' };
  HAP.land = { name: 'land', gen: 'UIImpactFeedbackGenerator', style: 'soft', intensity: 'touchdown speed (0.3–1)', vibe: '8–22ms', call: 'Haptics.land(i)' };

  const PATHS = { 1: '/', 2: '/v2/', 3: '/v3/' };
  const ITER = { 1: 'Iteration 01 · yellow bot, dark "Deals we think you\'ll love"', 2: 'Iteration 02 · YFS Neha feed, purple bot docks on scroll', 3: 'Iteration 03 · light For You (Figma 616:27565)' };

  const SPR = {
    move:  { name: 'MOVE spring (deck cards)', w: 16.75, z: 0.81, src: 'yf-page.js deck — K 280.6 / C 27.14 per card, rAF' },
    soft:  { name: 'Deck fade + blur spring', w: 14.98, z: 0.81, src: 'yf-page.js deck — the o / b channels at 0.8 × K' },
    loop:  { name: 'Carousel spring', w: 15.49, z: 0.981, src: 'yf-page.js loopCarousel — stiffness 240, damping 30.4' },
    dock:  { name: 'Bot stage spring (to a spot)', w: 11, z: 0.999, src: 'main.js orbi.stage — ω 11, critically damped' },
    home:  { name: 'Bot stage spring (back)', w: 9, z: 0.999, src: 'main.js orbi.stage(null) — ω 9, critically damped' },
    turn:  { name: 'Bot 360° turn', w: 9, z: 0.86, src: 'main.js PAGE_TURN — kick 2.6 rad/s' },

      { icon: 'move', prop: 'Move · Size', layer: 'Bot', sel: '#orbiHit', delay: 0, dur: PAGE.close, from: 'its spot on the page', to: '327, 681.5 · 30', ease: C('page'), note: 'Flies home on the same arc in reverse.' },
      H('land', 'Bot', '#orbiHit', PAGE.close + 5, 'A soft landing back in its corner (0.35).', { approx: true }),
      { icon: 'flag', prop: 'Reset', layer: 'Page', sel: '#orbiSheet', delay: PAGE.close + 5, dur: 100, from: 'used', to: 'fresh', ease: C('lin'), approx: true, note: 'Once closed the page resets: scrolled to the top, carousels on their first item, coupons flipped back, ticks and hearts off.' },
    ];
  }

  /* ═══ driving the prototype ═══════════════════════════════════════════════ */
  const sc = (w) => w.yfPage.scroller;
  const shown = (el) => el.style.visibility !== 'hidden' && +(el.style.opacity || 1) > 0.05;
  const edgeOf = (d, sel, dir) => { const xs = [...d.querySelectorAll(sel)].filter(shown).sort((a, b) => a.getBoundingClientRect().left - b.getBoundingClientRect().left); return dir < 0 ? xs[0] : xs[xs.length - 1]; };
  const tap = (w, el, oy = 0.5) => {
    if (!el) return;
    w.Element.prototype.setPointerCapture = function () {};
    const r = el.getBoundingClientRect(), o = { bubbles: true, cancelable: true, clientX: Math.min(360, Math.max(15, r.left + r.width / 2)), clientY: r.top + r.height * oy, pointerId: 7, pointerType: 'mouse', isPrimary: true, button: 0, buttons: 1 };
    el.dispatchEvent(new w.PointerEvent('pointerdown', o));
    el.dispatchEvent(new w.PointerEvent('pointerup', { ...o, buttons: 0 }));
  };
  const press = (w, el) => {   // a real press: down, then up + click 90 ms later
    if (!el) return;
    const r = el.getBoundingClientRect(), o = { bubbles: true, cancelable: true, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2, pointerId: 8, pointerType: 'mouse', isPrimary: true, button: 0, buttons: 1 };
    el.dispatchEvent(new w.PointerEvent('pointerdown', o));
    w.setTimeout(() => { el.dispatchEvent(new w.PointerEvent('pointerup', { ...o, buttons: 0 })); el.click(); }, PRESS);
  };
  const scrollTo = (w, to, ms) => {   // an ease-out cubic flick, with the scroll events the virtual clock would miss
    const s = sc(w), from = s.scrollTop, n = Math.max(1, Math.round(ms / 16));
    for (let i = 1; i <= n; i++) w.setTimeout(() => { const u = i / n; s.scrollTop = from + (to - from) * (1 - Math.pow(1 - u, 3)); s.dispatchEvent(new w.Event('scroll')); }, i * 16);
  };
  const own = (d) => d.getElementById('orbiSheet').getAnimations({ subtree: true }).filter((a) => !a.animationName && !a.transitionProperty);
  const calm = (d) => own(d).every((a) => a.playState === 'finished' || a.playState === 'idle');
  const botAt = (w) => { const v = w.orbi.view; return { x: v.cx, y: v.cy, u: v.unit }; };
  const still = async (w, e) => { let a = botAt(w); for (let i = 0; i < 80; i++) { await e.advanceTo(e.vt + 48, 16); const b = botAt(w); if (Math.abs(a.x - b.x) + Math.abs(a.y - b.y) + Math.abs(a.u - b.u) < 0.05) return; a = b; } };
  const ST = {
    async home(d, w, e) { await e.advanceTo(e.vt + 3000, 32); },
    async open(d, w, e) {
      await ST.home(d, w, e); w.orbi.goPage(true);
      await e.stepUntil(() => d.querySelector('.d3-coupons .d3-cp').getAnimations().length > 0, 8000);   // the reveal has begun
      await e.stepUntil(() => calm(d), 5000); await still(w, e); await e.advanceTo(e.vt + 400, 32);
    },
    async coupon2(d, w, e) { await ST.open(d, w, e); tap(w, edgeOf(d, '.d3-cslot', 1), 0.45); await e.advanceTo(e.vt + 1000, 16); },
    async collected(d, w, e) { await ST.open(d, w, e); press(w, d.querySelector('.d3-cta.redeem')); await e.advanceTo(e.vt + 1600, 16); await still(w, e); },
    async scrollAndSettle(d, w, e, to, ms) {
      scrollTo(w, to, ms); await e.advanceTo(e.vt + ms + 48, 16);
      await realWait(160); await e.advanceTo(e.vt + 32, 16); await realWait(80);        // (IntersectionObserver reports on real frames)
      await e.stepUntil(() => calm(d), 5000); await e.advanceTo(e.vt + 1400, 32); await still(w, e);
    },
    async picks(d, w, e) { await ST.open(d, w, e); await ST.scrollAndSettle(d, w, e, SCROLL.picks, 600); },
    async deckAdded(d, w, e) { await ST.picks(d, w, e); d.querySelector('.d3-dk.is-top .d3-add').click(); await e.advanceTo(e.vt + 2200, 16); await still(w, e); },
    async hearted(d, w, e) { await ST.picks(d, w, e); d.querySelector('.d3-dk.is-top .d3-wish')?.click(); await e.advanceTo(e.vt + 1000, 16); await still(w, e); },
    async refill(d, w, e) { await ST.picks(d, w, e); await ST.scrollAndSettle(d, w, e, SCROLL.refill, 700); },
    async refillHearted(d, w, e) { await ST.refill(d, w, e); d.querySelector('.d3-rslot.is-mid .d3-wish').click(); await e.advanceTo(e.vt + 1000, 16); await still(w, e); },
    async refillAdded(d, w, e) { await ST.refill(d, w, e); d.querySelector('.d3-rslot.is-mid .d3-add').click(); await e.advanceTo(e.vt + 2200, 16); await still(w, e); },
    async visited(d, w, e) {   // a used page, then closed: the next open starts from Home again, reset
      await ST.collected(d, w, e); w.orbi.goPage(false);
      await e.stepUntil(() => !w.orbi.pageOpen && calm(d) && d.getElementById('orbiSheet').getAttribute('aria-hidden') !== 'false', 4000); await e.advanceTo(e.vt + 1500, 32); await still(w, e);
    },
  };
  const PREP = { 1: 'home', 2: 'open', 3: 'open', 4: 'open', 5: 'collected', 6: 'open', 7: 'picks', 8: 'picks', 9: 'picks', 10: 'picks', 11: 'deckAdded', 12: 'picks', 13: 'hearted',
    14: 'picks', 15: 'refill', 16: 'refill', 17: 'refill', 18: 'refillAdded', 19: 'refill', 20: 'refillHearted', 21: 'refill', 22: 'open', 23: 'refill', 24: 'visited' };
  const FIRE = {
    1: (d, w) => w.orbi.goPage(true),
    2: (d, w) => tap(w, edgeOf(d, '.d3-cslot', 1), 0.45),
    3: (d, w) => tap(w, edgeOf(d, '.d3-cslot', -1), 0.45),
    4: (d, w) => press(w, d.querySelector('.d3-cta.redeem')),
    5: (d, w) => press(w, d.querySelector('.d3-cta.redeem')),
    6: (d, w) => scrollTo(w, SCROLL.picks, 600),
    7: (d) => d.querySelector('.d3-cubes.r').click(),
    8: (d) => d.querySelector('.d3-cubes.l').click(),
    9: (d, w) => { d.querySelector('.d3-cubes.r').click(); w.setTimeout(() => d.querySelector('.d3-cubes.r').click(), 180); },
    10: (d) => d.querySelector('.d3-dk.is-top .d3-add').click(),
    11: (d) => d.querySelector('.d3-dk.is-top .d3-add').click(),
    12: (d) => d.querySelector('.d3-dk.is-top .d3-wish')?.click(),
    13: (d) => d.querySelector('.d3-dk.is-top .d3-wish')?.click(),
    14: (d, w) => scrollTo(w, SCROLL.refill, 700),
    15: (d, w) => tap(w, edgeOf(d, '.d3-rslot', 1), 0.4),
    16: (d, w) => tap(w, edgeOf(d, '.d3-rslot', -1), 0.4),
    17: (d) => d.querySelector('.d3-rslot.is-mid .d3-add').click(),
    18: (d) => d.querySelector('.d3-rslot.is-mid .d3-add').click(),
    19: (d) => d.querySelector('.d3-rslot.is-mid .d3-wish').click(),
    20: (d) => d.querySelector('.d3-rslot.is-mid .d3-wish').click(),
    21: (d, w) => scrollTo(w, 0, 800),
    22: (d, w) => { const b = d.getElementById('orbiClose'); b.dispatchEvent(new w.PointerEvent('pointerdown', { bubbles: true, pointerId: 9, pointerType: 'mouse', button: 0, buttons: 1 })); b.click(); },
    23: (d, w) => w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true })),
    24: (d, w) => w.orbi.goPage(true),
  };

  /* the Overview: one visit, each widget once, at a human pace */
  const JOURNEY = [1, 2, 4, 6, 7, 10, 12, 14, 15, 17, 19, 21, 22];
  function overview(v) {
    const at = {}; let t = 0;
    JOURNEY.forEach((id) => { at[id] = t; t += sceneEnd(SCENES[id].rows(v)) + (id === 1 ? 300 : 700); });
    const rows = JOURNEY.map((id) => ({ icon: 'flag', prop: `${id}`, layer: SCENES[id].name, sel: null, delay: at[id], dur: sceneEnd(SCENES[id].rows(v)), scene: id, from: '', to: '', ease: { kind: 'scene' }, note: `${SCENES[id].trig}.` }));
    const beats = JOURNEY.map((id) => ({ at: at[id], fire: (d, w) => FIRE[id](d, w) }));
    return { rows, beats };
  }
  PREP[0] = 'home';

  return {
    title: 'Full Flow — Animation Spec', device: { w: 375, h: 812, label: 'Custom (375x812 @3x)' },
    legend: { approx: 'starts with the bot\'s own spring or the scroll observer (≈)' },
    paths: PATHS, iterations: ITER, springs: SPR, curves: CURVE, scenes: SCENES, overview, states: ST, prep: PREP, fire: FIRE,
    assets: [],
  };
})();
</script>

<script>
/* ═══ SPEC SHEET ENGINE — identical in every project (copy as-is; configure via window.SPEC) ═══ */
(() => {
  const { paths: PATHS, iterations: ITER, springs: SPR, curves: CURVE, scenes: SCENES, overview, states: ST, prep: PREP, fire: FIRE } = window.SPEC;
  const { springFn, rowEnd, sceneEnd } = window.SpecKit;
  const DW = (window.SPEC.device || {}).w || 375, DH = (window.SPEC.device || {}).h || 812;
  /* ═══ helpers ═══════════════════════════════════════════════════════════ */
  const $ = (id) => document.getElementById(id);
  const fmtS = (ms) => `${(+(ms / 1000).toFixed(2))}s`;
  const fmtMs = (ms) => `${Math.round(ms)}ms`;
  const ICON = {
    scale: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 16 16 4M4 16v-5M4 16h5M16 4h-5M16 4v5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    opacity: '<svg width="20" height="20" viewBox="0 0 20 20"><g fill="currentColor"><rect x="3" y="3" width="4" height="4"/><rect x="11" y="3" width="4" height="4"/><rect x="7" y="7" width="4" height="4"/><rect x="15" y="7" width="2" height="4"/><rect x="3" y="11" width="4" height="4"/><rect x="11" y="11" width="4" height="4"/><rect x="7" y="15" width="4" height="2"/></g><g fill="#c7c7cc"><rect x="7" y="3" width="4" height="4"/><rect x="3" y="7" width="4" height="4"/><rect x="11" y="7" width="4" height="4"/><rect x="7" y="11" width="4" height="4"/><rect x="15" y="11" width="2" height="4"/></g></svg>',
    move: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2v16M2 10h16" stroke="currentColor" stroke-width="1.6"/><path d="m10 1.5 2.4 3H7.6zM10 18.5l2.4-3H7.6zM1.5 10l3-2.4v4.8zM18.5 10l-3-2.4v4.8z" fill="currentColor"/></svg>',
    size: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2.5v15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="m6.5 6 3.5-3.5L13.5 6M6.5 14l3.5 3.5 3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 2.5h14M3 17.5h14" stroke="#c7c7cc" stroke-width="1.4"/></svg>',
    haptic: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="6.5" y="3" width="7" height="14" rx="1.8" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 7v6M1.5 8.5v3M16.5 7v6M18.5 8.5v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    flag: '<svg width="18" height="16" viewBox="0 0 18 16"><path d="M2 1v14" stroke="currentColor" stroke-width="2"/><path d="M3 1.5h12l-3 4 3 4H3z" fill="currentColor"/></svg>',
  };
  function linearAt(fn, u) {
    const parts = fn.replace(/^linear\(|\)$/g, '').split(',').map((s) => s.trim().split(/\s+/));
    const pts = parts.map((p) => ({ y: +p[0], x: p[1] ? parseFloat(p[1]) / 100 : null }));
    pts[0].x ??= 0; pts[pts.length - 1].x ??= 1;
    for (let i = 1; i < pts.length - 1; i++) if (pts[i].x == null) { let j = i; while (pts[j].x == null) j++; const a = pts[i - 1].x, b = pts[j].x; for (let k = i; k < j; k++) pts[k].x = a + ((b - a) * (k - i + 1)) / (j - i + 1); }
    for (let i = 1; i < pts.length; i++) if (u <= pts[i].x) { const p = pts[i - 1], q = pts[i]; return p.y + ((q.y - p.y) * (u - p.x)) / ((q.x - p.x) || 1); }
    return 1;
  }
  function springProgress(e) { const s = SPR[e.k], x0 = e.x0 ?? -1, f = springFn(s.w, s.z, x0, e.v0 ?? 0); return (t) => 1 - f.d(t) / x0; }
  function springStats(e) {
    const p = springProgress(e); let peak = 0, settle = 0;
    for (let t = 0; t < 4; t += 0.001) { const y = p(t); peak = Math.max(peak, y); if (Math.abs(1 - y) > 0.01) settle = t; }
    return { overshoot: Math.max(0, peak - 1) * 100, settle: settle * 1000 };
  }

  /* ═══ state ═══════════════════════════════════════════════════════════════ */
  const qs = new URLSearchParams(location.search);
  let v = +qs.get('v') || 1; if (!PATHS[v]) v = 1;
  let sc = qs.has('s') ? +qs.get('s') : 0; if (!SCENES[sc]) sc = 0;
  let rows = [], beats = [], END = 2000, selected = -1, layerFilter = '';
  const SPEEDS = [1, 0.5, 0.25]; let speedIdx = 0;

  /* ═══ flow list + timeline ═══════════════════════════════════════════════ */
  const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  // the layers a scene animates, in timeline order: [name, { sels, n }]
  const layersOf = (rs) => { const m = new Map();
    rs.forEach((r) => { if (r.grp || r.scene != null || !r.sel) return; const e = m.get(r.layer) || { sels: new Set(), n: 0 }; e.sels.add(r.sel); e.n++; m.set(r.layer, e); });
    return [...m.entries()]; };
  const LAYER_ICO = '<svg class="tree__ico" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="1" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2.2 1.8"/></svg>';
  let treeOpenedFor = null, treeOpenedAt = 0;                   // the tree animates in when its scene opens, not on every selection
  function renderFlow() {
    if (treeOpenedFor !== sc) { treeOpenedFor = sc; treeOpenedAt = performance.now(); }
    const fresh = performance.now() - treeOpenedAt < 300;
    $('flow').innerHTML = SCENES.map((s) => {
      const len = s.overview ? sceneEnd(overview(v).rows) : sceneEnd(s.rows(v));
      const kids = s.id === sc && !s.overview ? layersOf(rows) : [];
      const curLayer = view === 'track' && rows[selected] ? rows[selected].layer : null;
      return `<li${kids.length ? ' class="is-open"' : ''}><button data-s="${s.id}" aria-pressed="${s.id === sc && view === 'scene'}" aria-current="${s.id === sc}"${kids.length ? ' aria-expanded="true"' : ''}><span class="n">${String(s.id).padStart(2, '0')}</span>
        <span class="nm">${s.name}${s.varies ? '<span class="tag tag--warm">varies</span>' : ''}</span><span class="len">${fmtS(len)}</span>
</button>${kids.length ? `
        <ul class="tree${fresh ? ' is-new' : ''}" role="group" aria-label="Layers in ${esc(s.name)}">${kids.map(([l, e]) => `<li><button data-l="${esc(l)}" aria-pressed="${view === 'layer' && layerView === l}"${curLayer === l ? ' data-cur' : ''}>${LAYER_ICO}<span class="tree__nm">${l}</span><span class="tree__n">${e.n}</span></button></li>`).join('')}</ul>` : ''}</li>`;
    }).join('');
  }
  const pct = (ms) => `${(ms / END) * 100}%`;
  function bars(r) {
    const lbl = (ms) => (ms / END) * 1000 > 34;
    const tight = r.marks && rowEnd(r) / END > 0.8;
    const sum = r.stagger ? `${fmtS(r.dur)} · ×${r.stagger.n} / ${r.stagger.step}ms`
      : r.marks && r.ease.kind === 'haptic' ? `${r.marks.length > 1 ? `×${r.marks.length} · ` : ''}${r.ease.style}${r.ease.intensity ? ` @${r.ease.intensity}` : ''}`
      : r.marks ? (r.marks.length > 1 ? `×${r.marks.length} · ${r.ease.ms}ms each` : `${r.ease.ms}ms`) : '';
    let h = r.delay > 0 ? `<div class="bar bar--delay" style="left:0;width:${pct(r.delay)}">${lbl(r.delay) ? `<span>${r.approx ? '≈' : ''}${fmtS(r.delay)}${tight ? ` → ${sum}` : ''}</span>` : ''}</div>` : '';
    if (r.marks) {
      h += r.marks.map((m) => `<div class="bar bar--mark" style="left:${pct(m)}"></div>`).join('');
      if (!tight) h += `<span class="after" style="left:${pct(Math.max(...r.marks))}">${sum}</span>`;
    } else if (r.stagger) {
      // one clean bar from the first element's start to the last one's end; the step count and gap
      // ride in the label (inside when the bar has room, else just after it)
      const span = rowEnd(r) - r.delay, roomy = span / END > 0.3;
      h += `<div class="bar bar--dur" style="left:${pct(r.delay)};width:${pct(Math.min(span, END - r.delay))}">${roomy ? `<span>${sum}</span>` : ''}</div>`;
      if (!roomy) h += `<span class="after" style="left:${pct(rowEnd(r))}">${sum}</span>`;
    } else {
      const cls = r.scene != null ? ' bar--scene' : r.approx ? ' bar--approx' : r.repeat ? ' bar--repeat' : '';
      h += `<div class="bar bar--dur${cls}" style="left:${pct(r.delay)};width:${pct(Math.min(r.dur, END - r.delay))}">${lbl(r.dur) ? `<span>${r.approx ? '≈' : ''}${fmtS(r.dur)}${r.repeat ? ' ↻' : ''}</span>` : ''}</div>`;
    }
    return h;
  }
  // R20 · two properties on one layer with identical timing (delay, duration, stagger) are one row:
  // "Scale · Move Y". Only within a group, never for haptics or marks; each keeps its own values in .parts
  function mergeRows(src) {
    const out = [], seen = new Map();
    const key = (r) => [r.layer, r.sel, Math.round(r.delay), Math.round(r.dur), r.stagger ? `${r.stagger.n}/${r.stagger.step}/${r.stagger.order}` : '', !!r.approx, !!r.repeat].join('|');
    src.forEach((r) => {
      if (r.grp) { seen.clear(); out.push(r); return; }
      if (r.marks || r.scene != null || r.ease.kind === 'haptic') { out.push(r); return; }
      const k = key(r), m = seen.get(k);
      if (!m) { const row = { ...r, parts: [r] }; seen.set(k, row); out.push(row); return; }
      m.parts.push(r); m.prop = m.parts.map((x) => x.prop).join(' · ');
    });
    out.forEach((r) => { if (r.parts && r.parts.length < 2) delete r.parts; });
    return out;
  }
  /* the ruler adapts to the lane's width: the label step is the smallest round value that keeps labels
     ≥ 64 px apart (minor ticks only where they get ≥ 8 px); the scene's end is always labelled and any
     label that would collide with it is dropped. Rebuilt whenever the lane resizes. */
  let LAST = 0, scaleW = 0;
  const STEPS = [100, 200, 250, 500, 1000, 2000, 2500, 5000, 10000, 15000, 30000, 60000];
  function renderScale() {
    const el = $('scale'), w = el.clientWidth || 600; scaleW = w;
    const pxPerMs = w / END, gap = (ms) => ms * pxPerMs;
    const major = STEPS.find((st) => gap(st) >= 64) || STEPS[STEPS.length - 1];
    const minor = [major / 5, major / 4, major / 2].find((st) => gap(st) >= 8);   // undefined → no minor ticks
    let s = `<span class="tick tick--zero" style="left:0">0</span>`;
    if (minor) for (let t = minor; t < END; t += minor) if (Math.round(t) % major) s += `<span class="tick tick--minor" style="left:${pct(t)}">.</span>`;
    for (let t = major; t < END; t += major) if (gap(Math.abs(t - LAST)) >= 56 && gap(END - t) >= 20) s += `<span class="tick" style="left:${pct(t)};color:var(--ink-3)">${fmtS(t)}</span>`;
    s += `<span class="tick" style="left:${pct(LAST)}">${fmtS(LAST)}</span>`;
    el.innerHTML = s;
  }
  new ResizeObserver(() => { const w = $('scale').clientWidth; if (w && Math.abs(w - scaleW) > 1) renderScale(); }).observe($('scale'));
  function renderTimeline() {
    const S0 = SCENES[sc];
    if (S0.overview) { const o = overview(v); rows = o.rows; beats = o.beats; } else { rows = mergeRows(S0.rows(v)); beats = []; }
    const last = sceneEnd(rows);
    const unit = last > 6000 ? 1000 : last > 2400 ? 500 : 100;
    END = Math.ceil((last + Math.max(60, last * 0.05)) / unit) * unit;
    LAST = last; renderScale();
    $('trigger').textContent = `· ${S0.trig}`;
    $('rows').innerHTML = rows.map((r, i) => r.grp
      ? `<div class="grp"><b>${r.grp}</b><span>@ ${fmtMs(r.at)}</span></div>`
      : `<div class="row" role="button" tabindex="0" data-i="${i}" aria-selected="false">
           <div class="row__lab">${ICON[r.icon]}<b>${r.scene != null ? `<em>${r.prop.padStart(2, '0')}</em>` : r.prop}</b><span>${r.layer}</span></div>
           <div class="row__trk">${bars(r)}</div></div>`).join('');
    applyFilter();
    showScene();
    $('title').textContent = window.SPEC.title;
    $('back').href = PATHS[v];
    setHead(END); renderFlow();

    el.addEventListener('mouseenter', () => { clearTimeout(toastT); left = Math.max(800, left - (performance.now() - from)); });
    el.addEventListener('mouseleave', arm);
    arm();
  }
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); return true; } catch (_) {}
    try { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (_) { return false; }
  }
  let copyT = 0;
  $('copy').addEventListener('click', async () => {
    const ok = await copyText(location.href), b = $('copy');
    b.innerHTML = ok ? `${CHECK}Copied` : 'Copy failed';
    toast(ok ? 'Link copied' : 'Couldn’t copy the link', ok ? CHECK : '');
    clearTimeout(copyT); copyT = setTimeout(() => { b.textContent = 'Copy link'; }, 2000);
  });
  addEventListener('keydown', (e) => { if (e.key === ' ' && e.target === document.body) { e.preventDefault(); togglePlay(); } });

  // ── Assets sheet: the Lottie files in SPEC.assets — preview, numbers from the file, scenes, Download / Download all ──
  const ASSETS = window.SPEC.assets || [], sheet = $('assetSheet'), DL = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const pad2 = (n) => String(n).padStart(2, '0'), inIter = (a) => !a.iters || a.iters.includes(v);
  const fileOf = (a) => a.download || decodeURIComponent(a.file.split('?')[0].split('/').pop());
  const assetData = new Map();
  // bytes as served (so a download is the file exactly). The preview plays a.preview (a Lottie JSON) when given, else
  // the file itself: a .json is parsed, a .lottie (dotLottie = zip of manifest.json + animations/<id>.json) is opened
  // in-page — stored or deflated entries, inflated with the browser's DecompressionStream
  const isJson = (a) => !/\.lottie(\?|#|$)/i.test(a.file);
  async function unzipLottie(bytes) {
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength), dec = new TextDecoder();
    let e = bytes.length - 22; while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--; if (e < 0) return null;
    let q = dv.getUint32(e + 16, true);
    for (let k = dv.getUint16(e + 10, true); k > 0; k--) {
      const meth = dv.getUint16(q + 10, true), csz = dv.getUint32(q + 20, true), nl = dv.getUint16(q + 28, true), xl = dv.getUint16(q + 30, true), cl = dv.getUint16(q + 32, true), off = dv.getUint32(q + 42, true);
      const name = dec.decode(bytes.subarray(q + 46, q + 46 + nl)); q += 46 + nl + xl + cl;
      if (!/^(animations\/)?[^/]+\.json$/i.test(name) || /manifest\.json$/i.test(name)) continue;
      const at = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true), raw = bytes.subarray(at, at + csz);
      if (meth === 0) return JSON.parse(dec.decode(raw));
      if (meth === 8 && 'DecompressionStream' in window) return JSON.parse(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text());
      return null;
    }
    return null;
  }
  const getAsset = (a) => { if (!assetData.has(a.file)) assetData.set(a.file, fetch(a.file).then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(async (buf) => { const bytes = new Uint8Array(buf); let json = null;
      try { json = a.preview ? await fetch(a.preview).then((r) => r.json()) : isJson(a) ? JSON.parse(new TextDecoder().decode(bytes)) : await unzipLottie(bytes); } catch (_) {}
      return { bytes, json }; })); return assetData.get(a.file); };
  let lottieP = null, players = [], sheetT = 0, sheetFrom = null;
  const loadLottie = () => lottieP ||= window.lottie ? Promise.resolve(window.lottie) : new Promise((res, rej) => {
    const el = document.createElement('script'); el.src = window.SPEC.lottieLib || 'https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js';
    el.onload = () => res(window.lottie); el.onerror = rej; document.head.appendChild(el); });
  function renderAssets() {
    const item = (a) => { const i = ASSETS.indexOf(a);
      return `<li class="ast"><div class="ast__pv"${a.bg ? ` style="--pv-bg:${esc(a.bg)}"` : ''}><div class="ast__lot" id="astLot${i}"></div></div><div class="ast__main">
        <b>${esc(a.name)}</b><span class="ast__file">${esc(fileOf(a))}</span>
        <div class="ast__tags"><span class="tag">${a.iters ? `Iteration ${a.iters.map(pad2).join(' · ')}` : Object.keys(PATHS).length > 1 ? 'All iterations' : `Iteration ${pad2(v)}`}</span></div></div>
        <button class="abtn abtn--sm ast__dl" type="button" data-dl="${i}" aria-label="Download ${esc(fileOf(a))}">${DL}Download</button></li>`; };
    const here = ASSETS.filter(inIter);                         // only the iteration being viewed
    $('assetList').innerHTML = here.length ? `<p class="eyebrow">Iteration ${pad2(v)}</p><ul>${here.map(item).join('')}</ul>` : `<p class="sheet__empty">No Lottie plays in Iteration ${pad2(v)}.</p>`;
    $('assetCount').textContent = here.length;
    $('assetAll').hidden = !here.length; $('assetAll').innerHTML = `${DL}Download all${here.length > 1 ? ` (${here.length})` : ''}`;
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    ASSETS.forEach((a, i) => getAsset(a).then(async (d) => {
      const j = d.json, box = $(`astLot${i}`); if (!box) return;
      if (!j) { box.parentNode.classList.add('ast__pv--file'); box.textContent = isJson(a) ? '.json' : '.lottie'; return; }   // couldn't read it: name the format
      box.parentNode.style.aspectRatio = `${j.w} / ${j.h}`;
      const L = await loadLottie(); if (!sheet.classList.contains('is-open') || !box.isConnected) return;
      players.push(L.loadAnimation({ container: box, renderer: 'svg', loop: true, autoplay: !still, animationData: structuredClone(j), rendererSettings: { preserveAspectRatio: 'xMidYMid meet' } }));
    }).catch(() => {}));
  }
  function paintAssets() {                                      // the header badge counts the viewed iteration's Lotties
    if (!ASSETS.length) return; const n = ASSETS.filter(inIter).length;
    $('assetsN').textContent = n; $('assetsBtn').setAttribute('aria-label', `Lottie assets in Iteration ${pad2(v)}: ${n}`);
  }
  function openAssets() {
    clearTimeout(sheetT); sheetFrom = document.activeElement; sheet.hidden = false; delete sheet.dataset.closing;
    renderAssets(); void sheet.offsetWidth; sheet.classList.add('is-open'); $('assetsBtn').setAttribute('aria-expanded', 'true');
    sheet.querySelector('.sheet__x').focus({ preventScroll: true });
  }
  function closeAssets() {
    if (!sheet.classList.contains('is-open')) return;
    sheet.classList.remove('is-open'); sheet.dataset.closing = ''; $('assetsBtn').setAttribute('aria-expanded', 'false');
    sheetT = setTimeout(() => { sheet.hidden = true; players.forEach((pl) => pl.destroy()); players = []; $('assetList').innerHTML = ''; }, 180);
    if (sheetFrom && sheetFrom.focus) sheetFrom.focus({ preventScroll: true });
  }
  const saveBlob = (blob, name) => { const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); };
  // Download all: one .zip (stored, no compression — Lottie JSON is small and this keeps the page dependency-free)
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = (u) => { let c = ~0; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return ~c >>> 0; };
  function zipStore(files) {
    const enc = new TextEncoder(), out = [], cen = []; let off = 0;
    for (const f of files) {
      const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length, h = new DataView(new ArrayBuffer(30)), c = new DataView(new ArrayBuffer(46));
      [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [12, 0x21, 2], [14, crc, 4], [18, sz, 4], [22, sz, 4], [26, nm.length, 2]].forEach(([o, x, n]) => (n === 4 ? h.setUint32(o, x, true) : h.setUint16(o, x, true)));
      [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [14, 0x21, 2], [16, crc, 4], [20, sz, 4], [24, sz, 4], [28, nm.length, 2], [42, off, 4]].forEach(([o, x, n]) => (n === 4 ? c.setUint32(o, x, true) : c.setUint16(o, x, true)));
      out.push(h, nm, f.data); cen.push(c, nm); off += 30 + nm.length + sz;
    }
    const csz = cen.reduce((t, p) => t + p.byteLength, 0), e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csz, true); e.setUint32(16, off, true);
    return new Blob([...out, ...cen, e], { type: 'application/zip' });
  }
  if (ASSETS.length) {
    $('assetsBtn').hidden = false; paintAssets(); $('assetsBtn').setAttribute('aria-expanded', 'false');
    $('assetsBtn').addEventListener('click', openAssets);
    sheet.addEventListener('click', async (e) => {
      if (e.target.closest('[data-close]')) return closeAssets();
      const dl = e.target.closest('[data-dl]');
      if (dl) { const a = ASSETS[+dl.dataset.dl]; try { const d = await getAsset(a); saveBlob(new Blob([d.bytes], { type: isJson(a) ? 'application/json' : 'application/zip+dotlottie' }), fileOf(a)); toast(`Downloaded ${esc(fileOf(a))}`); }
        catch (_) { toast('Couldn’t download the file', ''); } return; }
      if (e.target.closest('#assetAll')) {
        try { const enc = new TextEncoder(), seen = new Set();
          const files = await Promise.all(ASSETS.filter(inIter).map(async (a) => { const d = await getAsset(a); return { name: fileOf(a), data: d.bytes }; }));
          files.forEach((f) => { let n = f.name, k = 2; while (seen.has(n)) n = f.name.replace(/(\.[^.]+)?$/, ` ${k++}$1`); seen.add(n); f.name = n; });
          const zipName = `${window.SPEC.title.replace(/ — .*/, '')} — Iteration ${pad2(v)} — Lottie assets.zip`.replace(/[\\/:*?"<>|]/g, '-');
          saveBlob(zipStore(files), zipName); toast(`Downloaded ${files.length} Lottie file${files.length > 1 ? 's' : ''} (.zip)`);
        } catch (_) { toast('Couldn’t download the files', ''); }
      }
    });
    addEventListener('keydown', (e) => {
      if (!sheet.classList.contains('is-open')) return;
      if (e.key === 'Escape') { e.preventDefault(); closeAssets(); return; }
      if (e.key === 'Tab') { const f = [...sheet.querySelectorAll('button, a[href]')].filter((x) => !x.disabled && x.offsetParent); if (!f.length) return;
        const first = f[0], last = f[f.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
    }, true);
  }

  document.title = window.SPEC.title.replace(/ — .*/, '') + ' Spec';
  document.documentElement.style.setProperty('--pw', `${DW}px`); document.documentElement.style.setProperty('--ph', `${DH}px`);
  if (window.SPEC.legend && window.SPEC.legend.approx) $('legendApprox').textContent = window.SPEC.legend.approx;
  renderTimeline(); fit(); rebuild();
})();
</script>
